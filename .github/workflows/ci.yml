name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: mypy (strict)
        run: mypy

  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Test
        run: pytest --cov=clarion --cov-report=xml
      - name: Every profile must compile
        shell: bash
        run: |
          for p in full concise code; do
            clarion build --profile "$p" > /dev/null && echo "ok: $p"
          done

  rubric-sync:
    name: rubric mirror in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: rubric.yaml must match rubric.py
        shell: bash
        run: |
          clarion rubric --export yaml > /tmp/rubric.yaml
          diff -q <(grep -v '^#' clarion/rubric.yaml) <(grep -v '^#' /tmp/rubric.yaml) \
            || (echo "clarion/rubric.yaml is stale — run 'make rubric'"; exit 1)
