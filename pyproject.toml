[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clarion"
version = "0.1.0"
description = "A portable output-discipline layer for LLMs: one system prompt, any model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Clarion contributors" }]
keywords = ["llm", "prompt-engineering", "system-prompt", "ai", "claude", "openai", "gemini", "evals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov>=4", "ruff>=0.5", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/OWNER/clarion"
Documentation = "https://github.com/OWNER/clarion/tree/main/docs"
Repository = "https://github.com/OWNER/clarion"
Changelog = "https://github.com/OWNER/clarion/blob/main/CHANGELOG.md"
Issues = "https://github.com/OWNER/clarion/issues"

[project.scripts]
clarion = "clarion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clarion"]

[tool.hatch.build.targets.wheel.force-include]
"clarion/modules" = "clarion/modules"
"clarion/adapters" = "clarion/adapters"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.10"
packages = ["clarion"]
mypy_path = "src"
strict = true
